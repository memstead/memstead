# Untagged-release watch.
#
# A release here is a tag: pushing it builds, attests, publishes and
# announces. A release commit that reaches main without its tag is a
# release nobody receives, and that happened twice in a row (0.9.0 was
# cut on 2026-08-19 and never tagged; every channel kept serving 0.8.1).
# `scripts/ci-status.sh` catches it for whoever runs the script; this
# workflow catches it for everyone else, once a day, by keeping exactly
# one issue in step with the check (scripts/untagged-release-issue.sh):
# filed when the workspace version has outrun the newest tag for more
# than a day, updated while the condition holds, closed when it clears,
# nothing filed on a tagged state.
#
# The run itself is red while the condition holds, so the failed-run
# notification reaches the operator beside the issue.

name: Untagged release

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: '23 6 * * *'   # daily, 06:23 UTC
  workflow_dispatch:

concurrency:
  group: untagged-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The check dates the release commit on origin/main with the
          # pickaxe, which needs history, not a depth-1 snapshot.
          fetch-depth: 0
          persist-credentials: true

      - name: Untagged-release check, one issue kept in step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/untagged-release-issue.sh --repo "${GITHUB_REPOSITORY}"
