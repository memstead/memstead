# The engine gate — every push and PR runs the complete test surface
# (engine + plugin suites via run-tests.sh, the same script developers
# run locally) on Linux and on macOS, the lint gates (clippy -D warnings,
# rustfmt), a check that the workspace still builds on its declared
# minimum Rust version, and a RustSec advisory audit. Windows has no job
# here: it stays documented as untested.
# A failing test, warning, format diff, or advisory turns the build red.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full test surface (run-tests.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          # run-tests.sh runs clippy and rustfmt itself — this job has no
          # lint step of its own to reveal that need, so it is stated here.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-nextest
      # ci/verify_gate.py parses the docs guide's printed workflow with a
      # real YAML parser rather than pattern-matching it, so the one gate
      # depends on PyYAML. Declared here because a missing package would
      # otherwise surface as "the documented verify-in-CI example FAILED" —
      # fail-closed, but with a confidently wrong diagnosis.
      - name: Install PyYAML (for the verify-in-CI gate harness)
        run: python3 -m pip install --user pyyaml
      - name: Run the full test surface
        run: ./run-tests.sh

  tests-macos:
    name: Full test surface on macOS (run-tests.sh)
    runs-on: macos-latest
    # A bound, not an estimate: docs/macos-dev-setup.md records a nextest
    # discovery hang on Apple Silicon when Gatekeeper serialises code-signing
    # checks, and a hung job would otherwise hold the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: cargo-nextest
      # Same reason as the Linux job. The runner's Homebrew Python refuses a
      # plain `pip install --user` as an externally managed environment
      # (PEP 668); the variable lifts that for this one package, and a pip
      # older than the rule ignores it.
      - name: Install PyYAML (for the verify-in-CI gate harness)
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install --user pyyaml
      - name: Run the full test surface
        run: ./run-tests.sh

  msrv:
    name: MSRV (cargo check on the declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The floor has one source, `rust-version` in the root Cargo.toml.
      # This step reads it instead of restating it, so raising the floor
      # moves this check in the same commit.
      - name: Read the declared rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no rust-version line in the root Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
      - name: cargo check on the MSRV toolchain
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  wasm:
    name: wasm tests (nodejs runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: . -> target
      - name: Install wasm-pack
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          tool: wasm-pack
      # This job is the kernel's portability proof: memstead-base must
      # build for wasm32 without gix, and this is the one leg that proves
      # it. memstead-wasm pulls
      # memstead-base with default-features off; the ingest/pipeline
      # modules sit ungated in that closure — this run is the dependency
      # gate AND the executed
      # test surface: the crate's assertions (hydration, getEntity, the
      # entityIds stability contract, commit application, typed refusals)
      # run in Node on every push and fail the job on assertion failure.
      # Previously `cargo check` gated only the build; the one guarantee a
      # consumer cannot check for themselves (stable entity ids) had never
      # executed anywhere.
      - name: Run memstead-wasm tests (wasm-pack, node target)
        run: wasm-pack test --node crates/memstead-wasm

  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    # The action reports via the Checks API on top of failing the job.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2026-0253: `lru` 0.16 (an unsound `pop()` when a stored
          # key's `Drop` panics under `catch_unwind`). It reaches the engine
          # only through tantivy's index cache, whose keys are plain
          # integers and file ids with no `Drop` of their own, and the engine
          # wraps no index read in `catch_unwind`, so the condition cannot
          # arise here. The patched line (0.18) is a major bump tantivy has
          # not taken (0.26.2 still pins 0.16). Retire this line the release
          # tantivy moves; owner: the engine maintainer.
          ignore: RUSTSEC-2026-0253
