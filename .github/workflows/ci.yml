# The engine gate — every push and PR runs the complete test surface
# (engine + plugin suites via run-tests.sh, the same script developers
# run locally), the lint gates (clippy -D warnings, rustfmt), and a
# RustSec advisory audit.
# A failing test, warning, format diff, or advisory turns the build red.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full test surface (run-tests.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          # run-tests.sh runs clippy and rustfmt itself — this job has no
          # lint step of its own to reveal that need, so it is stated here.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-nextest
      # ci/verify_gate.py parses the docs guide's printed workflow with a
      # real YAML parser rather than pattern-matching it, so the one gate
      # depends on PyYAML. Declared here because a missing package would
      # otherwise surface as "the documented verify-in-CI example FAILED" —
      # fail-closed, but with a confidently wrong diagnosis.
      - name: Install PyYAML (for the verify-in-CI gate harness)
        run: python3 -m pip install --user pyyaml
      - name: Run the full test surface
        run: ./run-tests.sh

  wasm:
    name: wasm tests (nodejs runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install stable toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target
      - name: Install wasm-pack
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: wasm-pack
      # This job is the kernel's portability proof: memstead-base must
      # build for wasm32 without gix, and this is the one leg that proves
      # it. memstead-wasm pulls
      # memstead-base with default-features off; the ingest/pipeline
      # modules sit ungated in that closure — this run is the dependency
      # gate AND, since backlog-sweep plan 04, the executed
      # test surface: the crate's assertions (hydration, getEntity, the
      # entityIds stability contract, commit application, typed refusals)
      # run in Node on every push and fail the job on assertion failure.
      # Previously `cargo check` gated only the build; the one guarantee a
      # consumer cannot check for themselves (stable entity ids) had never
      # executed anywhere.
      - name: Run memstead-wasm tests (wasm-pack, node target)
        run: wasm-pack test --node crates/memstead-wasm

  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    # The action reports via the Checks API on top of failing the job.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
