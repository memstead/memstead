[package]
name = "memstead-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line interface for Memstead — query and mutate typed entity graphs from the shell. Builds the `memstead` binary (multi-mem, git-backed; folder workspaces served by the same engine)."
readme = "README.md"
keywords = ["agent-memory", "cli", "knowledge-graph", "markdown", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "memstead"
path = "src/main.rs"

[dependencies]
memstead-base.workspace = true
memstead-git-branch.workspace = true
memstead-schema.workspace = true
clap.workspace = true
gix.workspace = true
indexmap.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dirs.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls", "webpki-roots"] }
tempfile.workspace = true
toml = "1.1"
toml_edit.workspace = true
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known", "serde"] }
# Domain-authority publishing: generate a signing keypair and sign a publish.
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
base64 = "0.23"
sha2.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
axum = "0.8"
memstead-git-branch = { workspace = true, features = ["test-support"] }
predicates.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zip.workspace = true

[lints]
workspace = true
