[package]
name = "memstead-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for Memstead — exposes the typed entity-graph engine over JSON-RPC stdio. Builds the `memstead-mcp` binary (multi-mem, git-backed; folder workspaces served by the same engine)."
readme = "README.md"
keywords = ["agent-memory", "mcp", "knowledge-graph", "agents", "llm"]
categories = ["command-line-utilities"]

[[bin]]
name = "memstead-mcp"
path = "src/main.rs"

[dependencies]
memstead-base.workspace = true
memstead-git-branch.workspace = true
memstead-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rmcp.workspace = true
semver.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
indexmap.workspace = true
clap.workspace = true
toml.workspace = true
dirs.workspace = true

[dev-dependencies]
gix.workspace = true
memstead-git-branch = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
