name: major_defect
description: A major defect found on an item.
when_to_use: One per defect.
sections:
  - key: description
    heading: Description
    required: true
    search_weight: 5.0
    catch_all: true
metadata_fields:
  - key: status
    required: true
    description: Defect state.
    field_type: string
    default_value: open
    enum_values: [open, closed]
    filterable: equality
title_weight: 100.0
text_fields: [description]
hierarchy_relationship: PART_OF
updatable_fields: [title, description, status, tags]
health_required_fields: [description]
staleness_threshold_days: 3650
required_outgoing:
  - relationships: [MAJOR_DEFECT_OF]
    cardinality: at_least_one
    severity: block
constraints:
  - kind: status_propagation
    field: status
    value: open
    relationships: [MAJOR_DEFECT_OF]
    direction: out
write_rules:
  - "Keep entries factual."
