name: inspector
description: A person authorised to inspect.
when_to_use: One per inspector.
sections:
  - key: profile
    heading: Profile
    required: true
    search_weight: 5.0
    catch_all: true
metadata_fields:
  - key: authorisation
    required: true
    description: Authorisation state.
    field_type: string
    default_value: authorised
    enum_values: [authorised, withdrawn]
    filterable: equality
title_weight: 100.0
text_fields: [profile]
hierarchy_relationship: PART_OF
updatable_fields: [title, profile, authorisation, tags]
health_required_fields: [profile]
staleness_threshold_days: 3650
constraints:
  - kind: status_propagation
    field: authorisation
    value: withdrawn
    relationships: [PERFORMED_BY, RESTS_ON]
    direction: in
write_rules:
  - "Keep entries factual."
