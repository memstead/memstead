name: critical_procedure
description: |
  A procedure marked critical: two independent approvals before effective.
when_to_use: |
  Use instead of procedure when the procedure is critical.
sections:
  - key: purpose
    heading: Purpose
    required: true
    search_weight: 10.0
  - key: steps
    heading: Steps
    search_weight: 5.0
    catch_all: true
metadata_fields:
  - key: status
    required: true
    description: Lifecycle state.
    field_type: string
    default_value: draft
    enum_values: [draft, effective, retired]
    filterable: equality
  - key: version
    required: true
    description: Procedure version label.
    field_type: string
    default_value: "1"
constraints:
  - kind: transition_requires_self_check
    field: status
    to_value: effective
    check_kind: x-approval-1
  - kind: transition_requires_self_check
    field: status
    to_value: effective
    check_kind: x-approval-2
title_weight: 100.0
text_fields: [purpose, steps]
hierarchy_relationship: PART_OF
updatable_fields: [title, purpose, steps, status, version, tags]
health_required_fields: [purpose]
staleness_threshold_days: 3650
write_rules:
  - "Keep entries factual."
