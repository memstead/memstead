[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Sign build provenance for every release artifact (GitHub Artifact
# Attestations — verifiable with `gh attestation verify <file> -R memstead/memstead`).
github-attestations = true
# The installers to generate for each app (dist emits ONE installer per
# dist-able app — memstead-cli-installer.sh and memstead-mcp-installer.sh;
# memstead.io/install.sh wraps both):
#   * `shell`    — `curl -sSf https://memstead.io/install.sh | sh`
#   * `homebrew` — auto-PRs the formula into the tap repo on tag push.
installers = ["shell", "homebrew"]
# Homebrew tap repository. cargo-dist opens a PR against this repo on
# every tagged release with the rendered formula. Requires a Personal
# Access Token with `contents:write` on the tap repo, exposed to the
# release workflow as the `HOMEBREW_TAP_TOKEN` secret. The tap repo
# itself must exist before the first release — operator-side one-time
# setup.
tap = "memstead/homebrew-memstead"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Publish jobs that run after the binary release lands. `homebrew`
# opens a PR to the tap repo above with the rendered formula; the two
# `./`-prefixed entries are our own workflow files in
# `.github/workflows/`, each wrapping the publish script that was run by
# hand until 2026-08-15. The tag is now the single trigger for every
# channel — binaries, Homebrew, crates.io and npm — which is what makes a
# release three commands instead of an afternoon.
#
# Both need repository secrets (`CARGO_REGISTRY_TOKEN`, `NPM_TOKEN`) and
# fail loudly when they are absent rather than skipping.
publish-jobs = ["homebrew", "./publish-crates", "./publish-npm"]
# The job that runs after `announce`: scripts/release-verify.sh asks every
# channel, from outside, whether it serves the tag, and reads the run's
# own publish jobs for one that SKIPPED on a non-prerelease (dist's
# announce accepts a skipped publish job by design, which is how a
# channel can be left unfed behind a green release). It fails the run
# when any channel disagrees. The same workflow runs on dispatch with a
# tag input, so any past release can be re-verified from CI.
post-announce-jobs = ["./release-verify"]
# Reading the run's jobs needs `actions: read`, which the workflow's
# top-level `contents: write` grant does not include; the checkout keeps
# `contents: read`.
github-custom-job-permissions = { release-verify = { actions = "read", contents = "read" } }
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
