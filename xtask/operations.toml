# Hand-maintained operation registry powering the Surface Parity Matrix.
#
# Each entry is a logical engine operation; the per-surface name slots
# resolve to the matching MCP tool, top-level CLI subcommand, and WASM
# JS-visible entry. A blank slot means the
# operation is not exposed on that surface. Surface entries the registry
# doesn't reference land in the matrix's "unaligned" sub-table — the
# matrix never silently drops a row when an extractor emits a name this
# file doesn't pin.

[[operation]]
name = "entity-read"
mcp = "memstead_entity"
cli = "entity"
wasm = "getEntity"

[[operation]]
name = "search"
mcp = "memstead_search"
cli = "search"
wasm = "search"

[[operation]]
name = "list"
cli = "list"

[[operation]]
name = "relations-read"
cli = "relations"

[[operation]]
name = "context"
cli = "context"

[[operation]]
name = "overview"
mcp = "memstead_overview"
cli = "overview"

[[operation]]
name = "status"
cli = "status"

[[operation]]
name = "schema-describe"
mcp = "memstead_schema"
cli = "type"
# The app's schema browser reads the same wire shape the MCP tool
# serves (single-sourced through render::build_schema_payload).

[[operation]]
name = "health"
mcp = "memstead_health"
cli = "health"
wasm = "health"

[[operation]]
name = "changes-since"
mcp = "memstead_changes_since"
cli = "changes"

[[operation]]
name = "reload"
mcp = "memstead_reload"
cli = "reload"

# Transport: deliberately CLI-only. Agents get no push/fetch primitive
# (security posture — moving a mem-repo off-machine is an owner
# decision), so the MCP slots stay blank on purpose.

[[operation]]
name = "fetch"
cli = "fetch"

[[operation]]
name = "pull"
cli = "pull"

[[operation]]
name = "push"
cli = "push"

[[operation]]
name = "branch-reset"
cli = "branch-reset"
# Deliberately absent from MCP (history rewriting stays off the agent
# wire). branch_reset_stranded_refs is the read-side confirmation
# companion.

[[operation]]
name = "create"
mcp = "memstead_create"
cli = "create"

[[operation]]
name = "update"
mcp = "memstead_update"
cli = "update"

[[operation]]
name = "relate"
mcp = "memstead_relate"
cli = "relate"

[[operation]]
name = "delete"
mcp = "memstead_delete"
cli = "delete"

[[operation]]
name = "rename"
mcp = "memstead_rename"
cli = "rename"

[[operation]]
name = "mem-create"
mcp = "memstead_mem_create"
cli = "mem"

[[operation]]
name = "mem-delete"
mcp = "memstead_mem_delete"
cli = "mem"

[[operation]]
name = "mem-set-version"
mcp = "memstead_mem_set_version"
cli = "mem"

[[operation]]
name = "workspace-allow-create"
cli = "workspace"
rationale = "workspace policy decides what an agent may do, so it is an operator surface: the CLI and the operator-authenticated web API, never the agent's MCP surface. A policy-gated mutation refuses with the exact command to report."

[[operation]]
name = "workspace-revoke-create"
cli = "workspace"
rationale = "workspace policy decides what an agent may do, so it is an operator surface: the CLI and the operator-authenticated web API, never the agent's MCP surface. A policy-gated mutation refuses with the exact command to report."

