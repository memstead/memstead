# Binding (projection-promotion) surface — the `memstead projection` tree.
# The projection is the unit: one versioned binding per source→mem
# obligation. The scaffold / migrate / advance / enable leaves are CLI-only
# (like the mem / workspace lifecycle rows, several operations share one
# top-level `projection` subcommand).

[[operation]]
name = "projection-brief"
cli = "projection"

[[operation]]
name = "projection-init"
cli = "projection"

[[operation]]
name = "projection-migrate"
cli = "projection"

[[operation]]
name = "projection-advance"
cli = "projection"

[[operation]]
name = "projection-enable"
cli = "projection"

# Parse-time-drift recovery. Reaches the CLI (`memstead recover`);
# no MCP tool (operator-initiated maintenance sweep).
[[operation]]
name = "parse-recovery"
cli = "recover"

[[operation]]
name = "agent-notes"

[[operation]]
name = "mem-head-sha"

# WASM-specific operations. Browser thin-clients hydrate from a `.mem`
# snapshot, then receive incremental updates as `applyCommit` envelopes
# produced by the bridge's `/commits` endpoint. `mem-names` is a cheap
# diagnostic accessor on the WASM side; the other surfaces expose
# equivalent information via overview/health, so no parity entry there.

[[operation]]
name = "from-snapshot"
wasm = "fromSnapshot"

[[operation]]
name = "apply-commit"
wasm = "applyCommit"

[[operation]]
name = "mem-names"
wasm = "memNames"

[[operation]]
name = "set-panic-hook"
wasm = "setPanicHook"
