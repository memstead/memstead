[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Internal build-tooling commands for the engine workspace. Invoked as `cargo run -p xtask -- <subcommand>`. The `generate-docs` subcommand renders the deterministic API-docs Markdown tree from the live MCP / CLI / WASM source into the directory the docs-site build names."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
memstead-base = { workspace = true }
memstead-cli.workspace = true
memstead-mcp.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
clap-markdown = "0.1.5"
regex.workspace = true
rmcp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
memstead-schema = { path = "../crates/memstead-schema" }
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true

[dev-dependencies]


[lints]
workspace = true
